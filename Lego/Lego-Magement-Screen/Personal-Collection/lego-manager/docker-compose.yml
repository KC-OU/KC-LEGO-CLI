services:
  lego-manager:
    build: .
    ports:
      - "80:8080" # Maps port 80 (standard web) to 8080 inside the container
    volumes:
      - ./lego_data:/root/data # Persists your database
      - ./lego_uploads:/root/uploads # Persists your uploaded LEGO files
    environment:
      - REBRICKABLE_API_KEY=${REBRICKABLE_API_KEY}
    restart: always
