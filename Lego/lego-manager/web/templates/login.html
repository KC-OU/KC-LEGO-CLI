{{template "layout.html" .}}
{{define "content"}}
<div class="min-h-[70vh] flex items-center justify-center">
    <div class="bg-white dark:bg-dark-card p-10 rounded-[2.5rem] shadow-2xl border border-gray-100 dark:border-dark-border w-full max-w-lg">
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-24 h-24 rounded-[2rem] bg-blue-600 text-white shadow-xl shadow-blue-500/30 mb-6">
                <svg class="w-12 h-12" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71L12 2z"></path></svg>
            </div>
            <h1 class="text-4xl font-black dark:text-white tracking-tighter uppercase mb-2">Terminal Login</h1>
            <p class="text-gray-500 dark:text-gray-400 font-medium italic uppercase tracking-widest text-[10px]">Secure Collection Access</p>
        </div>

        {{if .Error}}
        <div class="bg-red-50 dark:bg-red-900/10 border border-red-100 dark:border-red-900/30 p-5 rounded-2xl mb-8 flex items-center">
            <svg class="w-6 h-6 text-red-600 mr-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
            <span class="text-red-700 dark:text-red-400 text-sm font-black uppercase tracking-tight">{{.Error}}</span>
        </div>
        {{end}}

        <form action="/login" method="POST" class="space-y-6">
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-2 ml-1">Operator Identifier</label>
                    <input type="text" name="username" required 
                        class="w-full px-6 py-4 bg-gray-50 dark:bg-dark-bg border-2 border-transparent focus:border-blue-600 dark:focus:border-blue-500 rounded-2xl font-bold dark:text-white transition-all outline-none"
                        placeholder="USERNAME / ID">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-2 ml-1">Security Token</label>
                    <input type="password" name="password" required
                        class="w-full px-6 py-4 bg-gray-50 dark:bg-dark-bg border-2 border-transparent focus:border-blue-600 dark:focus:border-blue-500 rounded-2xl font-bold dark:text-white transition-all outline-none"
                        placeholder="••••••••">
                </div>
            </div>
            
            <div class="pt-4 space-y-4">
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-5 rounded-[1.5rem] shadow-xl shadow-blue-500/30 transition-all active:scale-[0.98] uppercase tracking-widest">
                    Authorize Session
                </button>
                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-gray-100 dark:border-dark-border"></div>
                    <span class="flex-shrink mx-4 text-gray-400 text-[10px] font-black uppercase tracking-widest">or</span>
                    <div class="flex-grow border-t border-gray-100 dark:border-dark-border"></div>
                </div>
                <a href="/login?guest=true" class="block w-full text-center py-4 bg-gray-50 dark:bg-dark-bg hover:bg-gray-100 dark:hover:bg-dark-border rounded-2xl text-gray-400 hover:text-blue-600 font-black uppercase tracking-widest text-[10px] transition-all">
                    Access as Guest (Read-Only)
                </a>
            </div>
        </form>
    </div>
</div>
{{end}}
