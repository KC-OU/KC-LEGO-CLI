<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lego Manager | Professional Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        dark: {
                            bg: '#0a0f1e',
                            card: '#161e31',
                            border: '#242f48',
                            text: '#f1f5f9'
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        .dark {
            color-scheme: dark;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-dark-bg text-gray-900 dark:text-gray-100 font-sans leading-normal tracking-normal min-h-full transition-colors duration-200">
    <nav class="bg-white/80 dark:bg-dark-card/80 backdrop-blur-md border-b border-gray-100 dark:border-dark-border p-4 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <a href="/" class="text-2xl font-black tracking-tighter flex items-center dark:text-white group">
                <div class="bg-blue-600 p-1.5 rounded-lg mr-2 group-hover:scale-110 transition-transform">
                    <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71L12 2z"></path></svg>
                </div>
                <span>BRICK<span class="text-blue-600">MANAGER</span></span>
            </a>
            <div class="space-x-1 flex items-center">
                <a href="/sets" class="px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-dark-border transition font-medium text-sm">Sets</a>
                <a href="/parts" class="px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-dark-border transition font-medium text-sm">Parts</a>
                <a href="/minifigures" class="px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-dark-border transition font-medium text-sm">Minifigures</a>
                <a href="/deals" class="px-3 py-2 rounded-lg hover:bg-yellow-50 dark:hover:bg-yellow-900/20 text-yellow-600 font-bold text-sm transition">Deals</a>
                <a href="/wishlist" class="px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-dark-border transition font-medium text-sm">Wishlist</a>
                <a href="/settings" class="px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-dark-border transition font-medium text-sm">Settings</a>
                {{if eq .Role "admin"}}
                <a href="/users" class="px-3 py-2 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20 text-red-600 font-bold text-sm transition">Users</a>
                {{end}}
                
                <div class="h-6 w-px bg-gray-200 dark:bg-dark-border mx-3"></div>

                <div class="flex items-center bg-gray-100 dark:bg-dark-border rounded-xl p-1">
                    <a href="/set-currency?c=USD" class="px-2 py-1 rounded-lg text-[10px] font-black tracking-tighter transition-all {{if eq .Currency "USD"}}bg-white dark:bg-dark-card shadow-sm text-blue-600{{else}}text-gray-400 hover:text-gray-600{{end}}">USD</a>
                    <a href="/set-currency?c=GBP" class="px-2 py-1 rounded-lg text-[10px] font-black tracking-tighter transition-all {{if eq .Currency "GBP"}}bg-white dark:bg-dark-card shadow-sm text-blue-600{{else}}text-gray-400 hover:text-gray-600{{end}}">GBP</a>
                </div>

                <div class="h-6 w-px bg-gray-200 dark:bg-dark-border mx-3"></div>

                <button id="theme-toggle" class="p-2 rounded-xl bg-gray-100 dark:bg-dark-border hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
                    <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5 text-gray-600" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                    <svg id="theme-toggle-light-icon" class="hidden w-5 h-5 text-yellow-500" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
                </button>

                {{if .Username}}
                <div class="flex items-center ml-4 pl-4 border-l border-gray-100 dark:border-dark-border">
                    <span class="text-xs font-bold text-gray-400 mr-3 hidden lg:block uppercase tracking-widest">{{.Username}}</span>
                    <a href="/logout" class="bg-red-600 hover:bg-red-700 text-white text-[10px] font-black px-3 py-1.5 rounded-lg transition uppercase tracking-tighter">Logout</a>
                </div>
                {{end}}
            </div>
        </div>
    </nav>
    <main class="container mx-auto p-4 md:p-8">
        {{block "content" .}}{{end}}
    </main>

    <script>
        var themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        var themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

        // Change the icons inside the button based on previous settings
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            themeToggleLightIcon.classList.remove('hidden');
            document.documentElement.classList.add('dark');
        } else {
            themeToggleDarkIcon.classList.remove('hidden');
            document.documentElement.classList.remove('dark');
        }

        var themeToggleBtn = document.getElementById('theme-toggle');

        themeToggleBtn.addEventListener('click', function() {
            // toggle icons inside button
            themeToggleDarkIcon.classList.toggle('hidden');
            themeToggleLightIcon.classList.toggle('hidden');

            // if set via local storage previously
            if (localStorage.getItem('color-theme')) {
                if (localStorage.getItem('color-theme') === 'light') {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                }

            // if NOT set via local storage previously
            } else {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                }
            }
        });
    </script>
    <script>
        // Global image error handler
        document.addEventListener('error', function (e) {
            if (e.target.tagName.toLowerCase() === 'img') {
                e.target.src = 'data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23ccc%22%20stroke-width%3D%221%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Crect%20x%3D%223%22%20y%3D%223%22%20width%3D%2218%22%20height%3D%2218%22%20rx%3D%222%22%20ry%3D%222%22%2F%3E%3Ccircle%20cx%3D%228.5%22%20cy%3D%228.5%22%20r%3D%221.5%22%2F%3E%3Cpolyline%20points%3D%2221%2015%2016%2010%205%2021%22%2F%3E%3C%2Fsvg%3E';
                e.target.onerror = null; // Prevent infinite loop
            }
        }, true);
    </script>
</body>
</html>
