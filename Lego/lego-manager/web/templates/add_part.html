{{template "layout.html" .}}
{{define "content"}}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold mb-6">Add New Lego Part</h1>
    <form action="/parts/add" method="POST" enctype="multipart/form-data">
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="part_num">
                Part Number (e.g., 3001)
            </label>
            <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="part_num" name="part_num" type="text" placeholder="Part Number" required>
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="color">
                Color (optional)
            </label>
            <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="color" name="color" type="text" placeholder="e.g., Red">
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="quantity">
                Quantity
            </label>
            <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="quantity" name="quantity" type="number" value="1" min="1">
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2" for="price">
                    Price
                </label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="price" name="price" type="number" step="0.01" placeholder="0.00">
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2" for="cost">
                    Cost
                </label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="cost" name="cost" type="number" step="0.01" placeholder="0.00">
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2" for="condition">
                    Condition
                </label>
                <select class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="condition" name="condition">
                    <option value="New">New</option>
                    <option value="Used">Used</option>
                    <option value="Incomplete">Incomplete</option>
                </select>
            </div>
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="remarks">
                Remarks
            </label>
            <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="remarks" name="remarks" type="text" placeholder="Remarks">
        </div>
        <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2">CAD Model (.ldr, .dat, .mpd)</label>
            <input type="file" name="cad_file" accept=".ldr,.dat,.mpd" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-bold file:bg-green-50 file:text-green-700 hover:file:bg-green-100">
        </div>
        <div class="flex items-center justify-between mt-6">
            <button class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="submit">
                Add Part
            </button>
            <a href="/parts" class="text-gray-600 hover:text-gray-800">Cancel</a>
        </div>
    </form>
    <div id="result" class="mt-6"></div>
</div>
{{end}}
