{{template "layout.html" .}}
{{define "content"}}
<div class="max-w-md mx-auto bg-white p-8 rounded shadow">
    <h2 class="text-2xl font-bold mb-6">Change Password</h2>
    {{if .Error}}
    <div class="bg-red-100 text-red-700 p-3 rounded mb-4">{{.Error}}</div>
    {{end}}
    <p class="mb-4 text-gray-600">You must change your password before proceeding.</p>
    <form action="/change-password" method="POST">
        <div class="mb-4">
            <label class="block text-gray-700 mb-2">New Password</label>
            <input type="password" name="password" class="w-full p-2 border rounded" required>
        </div>
        <div class="mb-6">
            <label class="block text-gray-700 mb-2">Confirm Password</label>
            <input type="password" name="confirm_password" class="w-full p-2 border rounded" required>
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Change Password</button>
    </form>
</div>
{{end}}
